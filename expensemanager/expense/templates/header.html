{% load static %}

<div class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-center justify-between gap-y-3 py-3 md:py-0 md:h-16">

            <a href="{% url 'home' %}" class="flex items-center gap-3 shrink-0">
                <div class="w-9 h-9 flex items-center justify-center">
                    <img src="{% static 'wallet.png' %}" alt="Expense Manager" class="h-full w-auto object-contain">
                </div>
                <span class="text-lg sm:text-xl font-bold text-gray-900">
                    Expense <span class="text-indigo-600">Manager</span>
                </span>
            </a>

            <div class="flex items-center gap-8 sm:gap-8 overflow-x-auto max-w-full pb-1 md:pb-0 order-3 md:order-2 w-full md:w-auto">
                <a href="{% url 'home' %}" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors whitespace-nowrap">
                    Home
                </a>
                <a href="{% url 'features' %}" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors whitespace-nowrap">
                    Features
                </a>
                <a href="{% url 'howitswork' %}" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors whitespace-nowrap">
                    How It Works
                </a>
                <a href="{% url 'about' %}" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors whitespace-nowrap">
                    About
                </a>
                <a href="{% url 'contact' %}" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors whitespace-nowrap">
                    Contact
                </a>
            </div>

            <div class="flex items-center gap-2 sm:gap-3 order-2 md:order-3">
                <a href="{% url 'login' %}"
                    class="inline-flex items-center gap-2 px-3 sm:px-4 py-2 border border-gray-200 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 hover:border-gray-300 transition-all shadow-sm whitespace-nowrap">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                    Login
                </a>

                <a href="{% url 'register' %}"
                    class="inline-flex items-center gap-2 px-3 sm:px-4 py-2 text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition-all shadow-sm whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                    Register
                </a>
            </div>

        </div>
    </div>
</div>
